name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    # Every build is CGO_ENABLED=0 now (the darwin cgo build existed for
    # the retired TUI's clipboard, issue #156), so any runner can
    # cross-compile all targets; macos-latest is simply what this job has
    # always run on. One job covers every artifact (nfpm runs here too).
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          # Uncomment after generating an AUR SSH key and adding it as a secret:
          # AUR_KEY: ${{ secrets.AUR_KEY }}
